version: '3.8'

services:
  vpn-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: warnetech-vpn:latest
    container_name: warnetech-vpn-server
    restart: unless-stopped
    ports:
      - "443:443/udp"   # QUIC
      - "443:443/tcp"   # TCP fallback
      - "51820:51820/udp"  # WireGuard (optional)
    volumes:
      - ./backend/config:/app/config
      - ./certs:/app/certs
      - vpn-logs:/var/log
    environment:
      - CONFIG_PATH=/app/config/server.json
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    networks:
      - vpn-network

networks:
  vpn-network:
    driver: bridge

volumes:
  vpn-logs:
